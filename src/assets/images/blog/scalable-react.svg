<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Scalable React applications cover</title>
  <desc id="desc">An abstract editorial illustration of layered application modules connected by route lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3ede2"/>
      <stop offset="1" stop-color="#e7dfd0"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c413c"/>
      <stop offset="1" stop-color="#1a2b27"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#9f8c74" stroke-opacity="0.18">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>

  <g>
    <path d="M650 148L850 268L650 388L450 268Z" fill="#d8cfbe" stroke="#b6a58d"/>
    <path d="M650 198L814 296L650 394L486 296Z" fill="#e6ddcd" stroke="#bcab93"/>
    <path d="M650 248L778 324L650 400L522 324Z" fill="url(#slab)"/>
    <path d="M650 250v148M524 324l252 0" stroke="#4c665f" stroke-opacity="0.7"/>
    <text x="650" y="324" fill="#9ff3e2" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13">FEATURE</text>
    <text x="650" y="344" fill="#7ea49a" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9">own the boundary</text>

    <rect x="800" y="118" width="132" height="42" rx="8" fill="#faf6ed" stroke="#cdbda6"/>
    <text x="816" y="144" fill="#6a5b47" font-family="ui-monospace, monospace" font-size="10">src/pages</text>
    <rect x="876" y="178" width="132" height="42" rx="8" fill="#faf6ed" stroke="#cdbda6"/>
    <text x="892" y="204" fill="#6a5b47" font-family="ui-monospace, monospace" font-size="10">src/lib</text>
    <rect x="760" y="452" width="176" height="42" rx="8" fill="#faf6ed" stroke="#cdbda6"/>
    <text x="776" y="478" fill="#6a5b47" font-family="ui-monospace, monospace" font-size="10">src/features/*</text>

    <line x1="650" y1="148" x2="800" y2="140" stroke="#b8885f" stroke-width="1.5"/>
    <line x1="650" y1="388" x2="760" y2="470" stroke="#b8885f" stroke-width="1.5"/>
    <circle cx="650" cy="148" r="4" fill="#b8552d"/>
    <circle cx="650" cy="388" r="4" fill="#b8552d"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="72" y="90" fill="#a25a35" font-size="12" font-weight="600" letter-spacing="3">ARCHITECTURE · REACT</text>
    <text x="72" y="168" fill="#1e2621" font-size="52" font-weight="600" letter-spacing="-1.8">Boundaries</text>
    <text x="72" y="224" fill="#1e2621" font-size="52" font-weight="600" letter-spacing="-1.8">before folders.</text>
    <text x="72" y="276" fill="#776b59" font-size="15">A structure that scales without ceremony.</text>
    <line x1="72" y1="512" x2="152" y2="512" stroke="#a25a35" stroke-width="2"/>
    <text x="72" y="546" fill="#8b7d68" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">AVERY LINDQVIST / JOURNAL</text>
  </g>
