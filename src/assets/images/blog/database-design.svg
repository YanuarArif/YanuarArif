      <rect x="634" y="148" width="220" height="10" fill="#1d3530"/>
      <text x="650" y="145" fill="#d9f7ef" font-size="11">orders</text>
      <text x="650" y="184" fill="#6f6455" font-size="9">id  ·  uuid  ·  pk</text>
      <text x="650" y="206" fill="#6f6455" font-size="9">customer_id  ·  fk</text>
      <text x="650" y="228" fill="#6f6455" font-size="9">status  ·  text</text>
      <text x="650" y="250" fill="#6f6455" font-size="9">created_at</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="900" y="320" width="200" height="150" rx="10" fill="#fffdf8" stroke="#d8cdbb"/>
      <rect x="900" y="320" width="200" height="38" rx="10" fill="#b65e37"/>
      <rect x="900" y="348" width="200" height="10" fill="#b65e37"/>
      <text x="916" y="345" fill="#fff4ec" font-size="11">order_lines</text>
      <text x="916" y="384" fill="#6f6455" font-size="9">id  ·  uuid  ·  pk</text>
      <text x="916" y="406" fill="#6f6455" font-size="9">order_id  ·  fk</text>
      <text x="916" y="428" fill="#6f6455" font-size="9">quantity  ·  int</text>
      <text x="916" y="450" fill="#6f6455" font-size="9">unit_price_cents</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="676" y="398" width="174" height="126" rx="10" fill="#fffdf8" stroke="#d8cdbb"/>
      <rect x="676" y="398" width="174" height="38" rx="10" fill="#466157"/>
      <rect x="676" y="426" width="174" height="10" fill="#466157"/>
      <text x="692" y="423" fill="#edf8f3" font-size="11">customers</text>
      <text x="692" y="462" fill="#6f6455" font-size="9">id  ·  uuid  ·  pk</text>
      <text x="692" y="484" fill="#6f6455" font-size="9">email  ·  unique</text>
      <text x="692" y="506" fill="#6f6455" font-size="9">created_at</text>
    </g>

    <path d="M744 320v78" stroke="#8d7358" stroke-width="1.2" stroke-dasharray="4 4"/>
    <path d="M854 220h46v180" stroke="#8d7358" stroke-width="1.2" stroke-dasharray="4 4"/>
    <circle cx="744" cy="320" r="3.5" fill="#b65e37"/>
    <circle cx="744" cy="398" r="3.5" fill="#b65e37"/>
    <circle cx="854" cy="220" r="3.5" fill="#466157"/>
    <circle cx="900" cy="400" r="3.5" fill="#466157"/>

    <text x="756" y="366" fill="#9b8064" font-size="8">customer_id</text>
    <text x="866" y="300" fill="#9b8064" font-size="8">order_id</text>
