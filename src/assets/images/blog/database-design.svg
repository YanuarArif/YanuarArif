  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="72" y="90" fill="#a25a35" font-size="12" font-weight="600" letter-spacing="3">DATABASES · DESIGN</text>
    <text x="72" y="168" fill="#1f2722" font-size="52" font-weight="600" letter-spacing="-1.8">Questions</text>
    <text x="72" y="224" fill="#1f2722" font-size="52" font-weight="600" letter-spacing="-1.8">before columns.</text>
    <text x="72" y="276" fill="#786c5b" font-size="15">A practical start for relational schemas.</text>
    <line x1="72" y1="512" x2="152" y2="512" stroke="#a25a35" stroke-width="2"/>
    <text x="72" y="546" fill="#8b7d68" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">YANUAR LUKMAN ARIF / JOURNAL</text>
