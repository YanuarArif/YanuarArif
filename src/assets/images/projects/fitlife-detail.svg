<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">FitLife workout session screen</title>
  <desc id="desc">A large mobile workout screen with a rest timer, set logging, and an offline sync indicator.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202a22"/>
      <stop offset="1" stop-color="#141b16"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f4ec"/>
      <stop offset="1" stop-color="#f1eee3"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="930" cy="180" r="260" fill="#36503d" opacity="0.22"/>
  <circle cx="220" cy="620" r="180" fill="#c1502a" opacity="0.12"/>
  <g stroke="#a9c0aa" stroke-opacity="0.07">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200"/>
    <path d="M200 0V750M400 0V750M600 0V750M800 0V750M1000 0V750"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="84" y="108" fill="#8fa18f" font-size="10" letter-spacing="2">SESSION / LOWER BODY</text>
    <text x="84" y="154" fill="#f1f5ec" font-size="34" font-weight="600" letter-spacing="-1">Steady, not rushed.</text>
    <text x="84" y="184" fill="#8fa18f" font-size="12">Four exercises. Rest as long as you need.</text>

    <rect x="84" y="224" width="304" height="84" rx="14" fill="#243128" stroke="#34473a"/>
    <circle cx="120" cy="266" r="16" fill="#d8895f"/>
    <path d="M116 259l10 7-10 7Z" fill="#2b1a11"/>
    <text x="150" y="260" fill="#edf3e8" font-size="11" font-weight="500">Session in progress</text>
    <text x="150" y="279" fill="#8fa18f" font-size="9">Started 18 minutes ago · 2 of 4 done</text>

    <rect x="84" y="328" width="304" height="112" rx="14" fill="#243128" stroke="#34473a"/>
    <text x="104" y="356" fill="#8fa18f" font-size="9" letter-spacing="1">OFFLINE MODE</text>
    <circle cx="108" cy="382" r="5" fill="#d8895f"/>
    <text x="122" y="386" fill="#e9efe4" font-size="11">Saved on this device</text>
    <text x="104" y="410" fill="#8fa18f" font-size="9">3 sessions waiting to sync</text>
    <text x="104" y="428" fill="#718474" font-size="8">Your workout is never interrupted by a connection.</text>

    <rect x="84" y="470" width="304" height="162" rx="14" fill="#243128" stroke="#34473a"/>
    <text x="104" y="498" fill="#8fa18f" font-size="9" letter-spacing="1">TODAY'S NOTE</text>
    <text x="104" y="524" fill="#c9d6c8" font-size="10.5">"Missed Monday? The plan moved your</text>
    <text x="104" y="544" fill="#c9d6c8" font-size="10.5">upper body session to Saturday. Nothing</text>
    <text x="104" y="564" fill="#c9d6c8" font-size="10.5">was lost."</text>
    <text x="104" y="600" fill="#718474" font-size="8">Plans adapt. Streaks are not the point.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="446" y="42" width="340" height="680" rx="52" fill="#1b221d"/>
    <rect x="460" y="56" width="312" height="652" rx="42" fill="url(#screen)"/>
    <rect x="554" y="68" width="124" height="24" rx="12" fill="#1b221d"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="486" y="128" fill="#899384" font-size="9" letter-spacing="1.4">LOWER BODY · 28 MIN</text>
    <text x="486" y="154" fill="#202a22" font-size="20" font-weight="600">Goblet squat</text>
    <text x="486" y="174" fill="#7b877a" font-size="9">Exercise 2 of 4 · 3 sets · 10 reps</text>

    <rect x="486" y="196" width="260" height="126" rx="18" fill="#26382c"/>
    <text x="616" y="232" fill="#a8bca9" text-anchor="middle" font-size="9" letter-spacing="1.6">REST</text>
    <text x="616" y="278" fill="#f7f8f0" text-anchor="middle" font-size="40" font-weight="500">01:12</text>
    <rect x="520" y="298" width="192" height="4" rx="2" fill="#3a4d3e"/>
    <rect x="520" y="298" width="108" height="4" rx="2" fill="#d8895f"/>
    <text x="616" y="333" fill="#a8bca9" text-anchor="middle" font-size="8">Next set · 16 kg</text>

    <text x="486" y="368" fill="#202a22" font-size="11" font-weight="600">Sets</text>
    <text x="746" y="368" fill="#8a9487" text-anchor="end" font-size="8">Weight / reps</text>

    <rect x="486" y="386" width="260" height="56" rx="12" fill="#ffffff" stroke="#e2ddcf"/>
    <text x="502" y="409" fill="#8a9487" font-size="8">SET 1</text>
    <text x="502" y="428" fill="#202a22" font-size="12" font-weight="500">16 kg × 10</text>
    <circle cx="720" cy="414" r="12" fill="#dfe9db"/>
    <path d="M715 414l4 4 6-7" fill="none" stroke="#47613f" stroke-width="1.6" stroke-linecap="round"/>

    <rect x="486" y="450" width="260" height="56" rx="12" fill="#ffffff" stroke="#e2ddcf"/>
    <text x="502" y="473" fill="#8a9487" font-size="8">SET 2</text>
    <text x="502" y="492" fill="#202a22" font-size="12" font-weight="500">16 kg × 10</text>
    <circle cx="720" cy="478" r="12" fill="#dfe9db"/>
    <path d="M715 478l4 4 6-7" fill="none" stroke="#47613f" stroke-width="1.6" stroke-linecap="round"/>

    <rect x="486" y="514" width="260" height="56" rx="12" fill="#fdf8ee" stroke="#d8895f"/>
    <text x="502" y="537" fill="#b66a44" font-size="8">SET 3 · CURRENT</text>
    <text x="502" y="556" fill="#202a22" font-size="12" font-weight="500">16 kg × 10</text>
    <circle cx="720" cy="542" r="12" fill="#d8895f"/>
    <path d="M715 542l4 4 6-7" fill="none" stroke="#fff7ef" stroke-width="1.6" stroke-linecap="round"/>

    <rect x="486" y="588" width="260" height="46" rx="14" fill="#25352a"/>
    <text x="616" y="616" fill="#f4f7ef" text-anchor="middle" font-size="11" font-weight="500">+ Log set</text>
    <rect x="486" y="650" width="260" height="1" fill="#e2ddcf"/>
    <text x="486" y="676" fill="#8a9487" font-size="8">Saved locally · will sync</text>
    <circle cx="736" cy="673" r="4" fill="#c88a5f"/>
  </g>
</svg>
