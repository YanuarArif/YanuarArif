<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">TaskFlow task detail and activity timeline</title>
  <desc id="desc">A task detail panel with subtasks, keyboard shortcut notes, and a chronological activity feed.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="0.2" cy="0.9" r="0.9">
      <stop offset="0" stop-color="#0f766e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0a100f" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="#0a100f"/>
  <rect width="1200" height="750" fill="url(#bgGlow)"/>
  <g stroke="#5eead4" stroke-opacity="0.055">
    <path d="M0 187H1200M0 374H1200M0 561H1200"/>
    <path d="M200 0V750M400 0V750M600 0V750M800 0V750M1000 0V750"/>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="140" y="58" width="920" height="634" rx="24" fill="#101917" stroke="#273530"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <line x1="864" y1="58" x2="864" y2="692" stroke="#1f2d29"/>
    <text x="880" y="102" fill="#8ea09a" font-size="11" font-weight="600" letter-spacing="1.2">ACTIVITY</text>

    <text x="176" y="106" fill="#5f746e" font-size="11" font-family="ui-monospace, monospace">TASK-142 / SPRINT 24</text>
    <text x="176" y="148" fill="#f2f7f4" font-size="26" font-weight="600">Keyboard shortcut map</text>
    <rect x="176" y="168" width="86" height="24" rx="12" fill="#1f3a33"/>
    <circle cx="191" cy="180" r="4" fill="#5eead4"/>
    <text x="203" y="184" fill="#8af0df" font-size="10">IN REVIEW</text>
    <rect x="272" y="168" width="94" height="24" rx="12" fill="#192622" stroke="#2a3a35"/>
    <text x="319" y="184" fill="#8ea09a" text-anchor="middle" font-size="10">ACCESSIBILITY</text>

    <circle cx="1146" cy="92" r="14" fill="#1c3a34"/>
    <text x="1146" y="96" fill="#88e5d5" text-anchor="middle" font-size="9">MK</text>

    <text x="176" y="232" fill="#a9bab4" font-size="12" font-weight="600">Description</text>
    <g fill="#7e908a" font-size="12">
      <text x="176" y="258">Document every board action that can be completed without a</text>
      <text x="176" y="278">pointer, including ordering, status changes, and bulk moves.</text>
      <text x="176" y="298">Announcements should state column and position after each move.</text>
    </g>

    <text x="176" y="344" fill="#a9bab4" font-size="12" font-weight="600">Checklist</text>
    <g>
      <rect x="176" y="360" width="16" height="16" rx="4" fill="#0f5f58"/>
      <path d="M180 368l3 3 5-6" fill="none" stroke="#d9fffa" stroke-width="1.6" stroke-linecap="round"/>
      <text x="204" y="373" fill="#7e908a" font-size="12">List keyboard shortcuts per view</text>

      <rect x="176" y="390" width="16" height="16" rx="4" fill="#0f5f58"/>
      <path d="M180 398l3 3 5-6" fill="none" stroke="#d9fffa" stroke-width="1.6" stroke-linecap="round"/>
      <text x="204" y="403" fill="#7e908a" font-size="12">Add live region messaging</text>

      <rect x="176" y="420" width="16" height="16" rx="4" fill="none" stroke="#40534d"/>
      <text x="204" y="433" fill="#7e908a" font-size="12">Test with VoiceOver and NVDA</text>
    </g>

    <rect x="176" y="470" width="644" height="140" rx="14" fill="#0c1412" stroke="#22302c"/>
    <text x="196" y="496" fill="#5f746e" font-size="10" font-family="ui-monospace, monospace">src/components/board/keyboard-map.ts</text>
    <g font-family="ui-monospace, monospace" font-size="11">
      <text x="196" y="524" fill="#6b7f79">// Move the focused card within its column</text>
      <text x="196" y="546" fill="#8af0df">const</text>
      <text x="234" y="546" fill="#c7d5d0">moveCard = (direction: 'up' | 'down') =&gt;</text>
      <text x="196" y="568" fill="#8af0df">  commit</text>
      <text x="248" y="568" fill="#c7d5d0">({ type: 'task.move', direction })</text>
      <text x="196" y="590" fill="#6b7f79">// Announces "In progress, position 2 of 3"</text>
    </g>

    <circle cx="900" cy="136" r="7" fill="#2dd4bf"/>
    <line x1="900" y1="143" x2="900" y2="208" stroke="#2a3a35"/>
    <text x="918" y="134" fill="#dfe8e4" font-size="12" font-weight="500">Moved to In review</text>
    <text x="918" y="152" fill="#61756f" font-size="10">Mikael K. · 12 minutes ago</text>
    <rect x="918" y="166" width="212" height="30" rx="8" fill="#15211e" stroke="#23332f"/>
    <text x="930" y="185" fill="#7f928c" font-size="10">Backlog → In review</text>

    <circle cx="900" cy="234" r="7" fill="#3d514b"/>
    <line x1="900" y1="241" x2="900" y2="318" stroke="#2a3a35"/>
    <text x="918" y="232" fill="#dfe8e4" font-size="12" font-weight="500">Assigned to Avery</text>
    <text x="918" y="250" fill="#61756f" font-size="10">You · 38 minutes ago</text>

    <circle cx="900" cy="344" r="7" fill="#3d514b"/>
    <line x1="900" y1="351" x2="900" y2="430" stroke="#2a3a35"/>
    <text x="918" y="342" fill="#dfe8e4" font-size="12" font-weight="500">Added 3 checklist items</text>
    <text x="918" y="360" fill="#61756f" font-size="10">You · 1 hour ago</text>

    <circle cx="900" cy="456" r="7" fill="#3d514b"/>
    <text x="918" y="454" fill="#dfe8e4" font-size="12" font-weight="500">Created from template</text>
    <text x="918" y="472" fill="#61756f" font-size="10">Jules S. · yesterday</text>

    <rect x="880" y="520" width="160" height="38" rx="10" fill="#0e1916" stroke="#22312d"/>
    <text x="960" y="544" fill="#7e908a" text-anchor="middle" font-size="11">All activity</text>
    <rect x="880" y="576" width="160" height="38" rx="10" fill="#0f5f58"/>
    <text x="960" y="600" fill="#eafffa" text-anchor="middle" font-size="11">Add comment</text>

    <rect x="176" y="638" width="644" height="1" fill="#1d2a27"/>
    <text x="176" y="666" fill="#5f746e" font-size="10">Last edited 12 minutes ago · revision 18</text>
  </g>
</svg>
