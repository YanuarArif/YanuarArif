<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">FitLife mobile training app</title>
  <desc id="desc">Two phone screens showing an activity ring, a weekly training plan, and a short workout summary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1e8"/>
      <stop offset="1" stop-color="#dfe5d9"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e07a4f"/>
      <stop offset="1" stop-color="#c1502a"/>
    </linearGradient>
    <filter id="phoneShadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#43503f" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="860" cy="120" r="230" fill="#cdd8c4" opacity="0.5"/>
  <circle cx="180" cy="650" r="180" fill="#e6cbb6" opacity="0.3"/>
  <g stroke="#8c9a85" stroke-opacity="0.16">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200"/>
    <path d="M200 0V750M400 0V750M600 0V750M800 0V750M1000 0V750"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="76" y="96" fill="#39463a" font-size="15" font-weight="700" letter-spacing="4">FITLIFE</text>
    <text x="76" y="120" fill="#768573" font-size="10" letter-spacing="1.4">TRAIN IN THE TIME YOU ACTUALLY HAVE</text>

    <g filter="url(#phoneShadow)">
      <rect x="236" y="118" width="304" height="590" rx="46" fill="#1b221d"/>
      <rect x="248" y="130" width="280" height="566" rx="36" fill="#f6f4ec"/>
      <rect x="338" y="140" width="100" height="22" rx="11" fill="#1b221d"/>
    </g>

    <text x="276" y="196" fill="#8b9486" font-size="9" letter-spacing="1.4">TUESDAY, 27 OCT</text>
    <text x="276" y="222" fill="#212b22" font-size="19" font-weight="600">Good morning, Avery</text>

    <circle cx="388" cy="314" r="62" fill="none" stroke="#e5e2d7" stroke-width="13"/>
    <circle cx="388" cy="314" r="62" fill="none" stroke="url(#ring)" stroke-width="13" stroke-dasharray="252 390" stroke-linecap="round" transform="rotate(-90 388 314)"/>
    <text x="388" y="310" fill="#212b22" text-anchor="middle" font-size="9" letter-spacing="1">MOVEMENT</text>
    <text x="388" y="333" fill="#212b22" text-anchor="middle" font-size="23" font-weight="600">24/30</text>
    <text x="388" y="350" fill="#84907e" text-anchor="middle" font-size="8">minutes</text>

    <rect x="276" y="398" width="224" height="70" rx="14" fill="#ffffff" stroke="#e6e1d5"/>
    <text x="292" y="421" fill="#8b9486" font-size="8" letter-spacing="1">NEXT SESSION</text>
    <text x="292" y="440" fill="#212b22" font-size="12" font-weight="600">Lower body strength</text>
    <text x="292" y="455" fill="#84907e" font-size="8">28 min · 4 exercises · dumbbells</text>
    <circle cx="474" cy="433" r="17" fill="#c1502a"/>
    <path d="M469 425l13 8-13 8Z" fill="#fdf9f1"/>

    <text x="276" y="502" fill="#212b22" font-size="11" font-weight="600">This week</text>
    <text x="500" y="502" fill="#8b9486" text-anchor="end" font-size="8">2 of 3</text>
    <g>
      <circle cx="288" cy="528" r="12" fill="#c1502a"/>
      <path d="M283 528l4 4 6-7" fill="none" stroke="#fff7f0" stroke-width="1.5" stroke-linecap="round"/>
      <text x="308" y="532" fill="#4d594b" font-size="9">Push · 22 min</text>
      <circle cx="288" cy="558" r="12" fill="#c1502a"/>
      <path d="M283 558l4 4 6-7" fill="none" stroke="#fff7f0" stroke-width="1.5" stroke-linecap="round"/>
      <text x="308" y="562" fill="#4d594b" font-size="9">Mobility · 14 min</text>
      <circle cx="288" cy="588" r="12" fill="none" stroke="#d6d2c6"/>
      <text x="308" y="592" fill="#8b9486" font-size="9">Lower body · today</text>
    </g>

    <rect x="276" y="622" width="224" height="42" rx="12" fill="#24332a"/>
    <text x="388" y="648" fill="#f3f6ee" text-anchor="middle" font-size="11" font-weight="500">Start workout</text>

    <g filter="url(#phoneShadow)">
      <rect x="628" y="80" width="304" height="590" rx="46" fill="#1b221d"/>
      <rect x="640" y="92" width="280" height="566" rx="36" fill="#202b24"/>
      <rect x="730" y="102" width="100" height="22" rx="11" fill="#151d18"/>
    </g>

    <text x="668" y="158" fill="#7f927f" font-size="9" letter-spacing="1.4">WEEK 43</text>
    <text x="668" y="184" fill="#f2f5ee" font-size="19" font-weight="600">A flexible plan</text>
    <text x="668" y="202" fill="#829486" font-size="8">Sessions move with your week.</text>

    <rect x="668" y="222" width="224" height="104" rx="14" fill="#2a372e"/>
    <text x="684" y="246" fill="#95a797" font-size="8" letter-spacing="1">CONSISTENCY</text>
    <text x="684" y="274" fill="#f7faf3" font-size="25" font-weight="600">3 weeks</text>
    <text x="684" y="292" fill="#819486" font-size="8">Not a streak. Just a rhythm.</text>
    <g>
      <circle cx="832" cy="270" r="24" fill="none" stroke="#3b4a3e" stroke-width="6"/>
      <circle cx="832" cy="270" r="24" fill="none" stroke="#d8895f" stroke-width="6" stroke-dasharray="102 151" stroke-linecap="round" transform="rotate(-90 832 270)"/>
    </g>

    <g font-size="9">
      <text x="668" y="356" fill="#8ea08f" font-size="8" letter-spacing="1">YOUR WEEK</text>
      <rect x="668" y="372" width="224" height="54" rx="10" fill="#2a362d"/>
      <text x="684" y="393" fill="#f0f4ec" font-size="10" font-weight="500">Mon · Upper body</text>
      <text x="684" y="410" fill="#829486" font-size="8">24 min · completed</text>
      <circle cx="870" cy="398" r="9" fill="#d8895f"/>
      <path d="M866 398l3 3 5-6" fill="none" stroke="#202b24" stroke-width="1.3" stroke-linecap="round"/>

      <rect x="668" y="434" width="224" height="54" rx="10" fill="#2a362d"/>
      <text x="684" y="455" fill="#f0f4ec" font-size="10" font-weight="500">Wed · Mobility</text>
      <text x="684" y="472" fill="#829486" font-size="8">14 min · completed</text>
      <circle cx="870" cy="460" r="9" fill="#d8895f"/>
      <path d="M866 460l3 3 5-6" fill="none" stroke="#202b24" stroke-width="1.3" stroke-linecap="round"/>

      <rect x="668" y="496" width="224" height="54" rx="10" fill="#33443a" stroke="#d8895f" stroke-opacity="0.4"/>
      <text x="684" y="517" fill="#f0f4ec" font-size="10" font-weight="500">Thu · Lower body</text>
      <text x="684" y="534" fill="#b7c7ba" font-size="8">28 min · ready</text>
      <circle cx="870" cy="522" r="11" fill="#d8895f"/>
      <path d="M866 516l9 6-9 6Z" fill="#202b24"/>
    </g>

    <rect x="668" y="570" width="224" height="42" rx="12" fill="#d8895f"/>
    <text x="780" y="596" fill="#28180f" text-anchor="middle" font-size="11" font-weight="600">View session</text>
    <text x="780" y="636" fill="#5e7263" text-anchor="middle" font-size="8">Works offline · syncs when connected</text>

    <g>
      <rect x="952" y="210" width="166" height="74" rx="12" fill="#f7f5ee" stroke="#dcd8cb"/>
      <text x="968" y="234" fill="#8c9689" font-size="8">LAST SESSION</text>
      <text x="968" y="255" fill="#283228" font-size="12" font-weight="600">+12% volume</text>
      <text x="968" y="270" fill="#8c9689" font-size="8">vs. your 4-week trend</text>
    </g>
  </g>
</svg>
