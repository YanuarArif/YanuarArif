    <circle cx="900" cy="400" r="46" fill="none" stroke="#f4c67c" stroke-width="16" stroke-dasharray="64 225" stroke-dashoffset="-134" stroke-linecap="round" transform="rotate(-90 900 400)"/>
    <circle cx="900" cy="400" r="46" fill="none" stroke="#7d9c94" stroke-width="16" stroke-dasharray="40 249" stroke-dashoffset="-202" stroke-linecap="round" transform="rotate(-90 900 400)"/>
