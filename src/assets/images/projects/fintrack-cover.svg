    <path d="M150 0V750M300 0V750M450 0V750M600 0V750M750 0V750M900 0V750M1050 0V750"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="56" y="44" width="1088" height="662" rx="20" fill="#0e1517" stroke="#25312f"/>
  </g>

  <g clip-path="url(#app)" font-family="ui-sans-serif, system-ui, sans-serif">
