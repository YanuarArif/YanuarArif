    <line x1="256" y1="44" x2="256" y2="706" stroke="#1b2728"/>
    <rect x="80" y="76" width="26" height="26" rx="7" fill="#0f5f58"/>
    <path d="M87 94v-7M93 94v-4M99 94v-10" stroke="#8cf3e2" stroke-width="2" stroke-linecap="round"/>
    <text x="118" y="95" fill="#edf3f1" font-size="14" font-weight="600">FinTrack</text>

    <rect x="76" y="136" width="160" height="34" rx="8" fill="#11201e"/>
