      <text x="298" y="619" fill="#7ddccb" text-anchor="middle" font-size="8">N</text>
      <text x="318" y="620" fill="#c6d3cf">Northwind Studio</text>
      <text x="480" y="620" fill="#61736e">Invoice #1042</text>
      <text x="1104" y="620" fill="#7ddccb" text-anchor="end">+€2,800.00</text>
      <circle cx="298" cy="646" r="9" fill="#302b1f"/>
      <text x="298" y="649" fill="#f4c67c" text-anchor="middle" font-size="8">R</text>
      <text x="318" y="650" fill="#c6d3cf">Rent — Østerbro</text>
      <text x="480" y="650" fill="#61736e">Recurring</text>
      <text x="1104" y="650" fill="#e1e9e5" text-anchor="end">−€1,780.00</text>
      <circle cx="298" cy="676" r="9" fill="#1c2b32"/>
      <text x="298" y="679" fill="#9dc3dc" text-anchor="middle" font-size="8">A</text>
      <text x="318" y="680" fill="#c6d3cf">Adobe Creative Cloud</text>
      <text x="480" y="680" fill="#61736e">Software · recurring</text>
      <text x="1104" y="680" fill="#e1e9e5" text-anchor="end">−€59.99</text>
      <text x="286" y="704" fill="#4f615d" font-size="8">Showing 3 of 24 transactions</text>
