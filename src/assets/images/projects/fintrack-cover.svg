      <text x="1072" y="381" fill="#dce6e2" text-anchor="end">23%</text>
      <circle cx="970" cy="404" r="4" fill="#7d9c94"/>
      <text x="982" y="407" fill="#9aaba6">Software</text>
      <text x="1072" y="407" fill="#dce6e2" text-anchor="end">14%</text>
      <circle cx="970" cy="430" r="4" fill="#3f514d"/>
