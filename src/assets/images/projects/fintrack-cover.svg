    <text x="286" y="578" fill="#e8efec" font-size="12" font-weight="600">Recent transactions</text>
    <text x="750" y="578" fill="#7a8d88" text-anchor="end" font-size="9">View all →</text>
    <line x1="286" y1="592" x2="1104" y2="592" stroke="#1e2b2c"/>
    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">
