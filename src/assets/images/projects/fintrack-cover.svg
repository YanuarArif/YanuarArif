    <g fill="#6b7b78" font-size="11">
      <text x="100" y="200">Transactions</text>
      <text x="100" y="238">Forecast</text>
      <text x="100" y="276">Categories</text>
      <text x="100" y="314">Accounts</text>
      <text x="100" y="352">Reports</text>
