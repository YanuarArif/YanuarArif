<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">FinTrack finance dashboard</title>
  <desc id="desc">A dark finance dashboard with balance cards, an area chart, spending donut, and recent transactions.</desc>
  <defs>
    <radialGradient id="glow" cx="0.15" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#0f766e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0b1113" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="app"><rect x="56" y="44" width="1088" height="662" rx="20"/></clipPath>
  </defs>

  <rect width="1200" height="750" fill="#0a1012"/>
  <rect width="1200" height="750" fill="url(#glow)"/>
  <g stroke="#5eead4" stroke-opacity="0.05">
