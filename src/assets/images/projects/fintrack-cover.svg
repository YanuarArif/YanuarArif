    <path d="M336 452C376 448 392 420 424 424s42 12 72-10 44-38 78-24 40 28 72 8 48-34 78-18V502H336Z" fill="url(#area)"/>
    <path d="M336 470C390 468 414 452 456 454s60 6 92-6 54-22 86-14 56 4 84-8" fill="none" stroke="#f4c67c" stroke-width="1.6" stroke-dasharray="4 4" opacity="0.8"/>
